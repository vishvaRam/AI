<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Core Architecture Dashboard Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #020617; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
        
        .nav-btn { transition: all 0.2s ease; }
        .nav-btn.active { background: rgba(34, 211, 238, 0.15); border-color: #22d3ee; color: #22d3ee; font-weight: 600; }
        
        /* Drawer animation profiles */
        .drawer-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen w-screen overflow-hidden relative m-0 p-0">

    <button onclick="toggleNavDrawer()" class="fixed top-4 left-4 z-50 px-4 h-12 bg-slate-900/80 backdrop-blur-md border border-slate-700 hover:border-cyan-400 text-white hover:text-cyan-400 font-mono text-xs font-bold rounded-xl shadow-2xl flex items-center gap-2 transition-all group">
        <i class="fa-solid fa-bars text-sm group-hover:rotate-90 transition-transform duration-300"></i>
        <span>Architecture Directory</span>
    </button>

    <div id="nav-drawer" class="fixed inset-y-0 left-0 w-80 bg-slate-950/95 backdrop-blur-lg border-r border-slate-800 z-50 drawer-transition -translate-x-full flex flex-col shadow-2xl">
        
        <div class="p-4 border-b border-slate-900 bg-slate-900/40 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-cubes-stacked text-cyan-400 text-xs"></i>
                <span class="text-[10px] uppercase font-mono tracking-widest font-bold text-slate-300">System Blueprint Tree</span>
            </div>
            <button onclick="toggleNavDrawer()" class="p-2 text-slate-500 hover:text-white font-mono text-xs hover:bg-slate-900 rounded-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <nav class="flex-1 overflow-y-auto p-4 space-y-5 custom-scrollbar text-xs">
            
            <div>
                <span class="px-2 pb-1.5 block font-mono text-[10px] uppercase tracking-wider text-slate-500 font-bold">Attention & Fused Kernels</span>
                <div class="space-y-1">
                    <button onclick="mountModule('flash_attention_deepdive.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2 active">
                        <i class="fa-solid fa-bolt text-cyan-400 w-4 text-center"></i> FlashAttention Kernel
                    </button>
                    <button onclick="mountModule('dflash_speculative_decoding.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-bolt-lightning text-cyan-400 w-4 text-center"></i> DFlash Deep Attn
                    </button>
                    <button onclick="mountModule('attention_mechanism.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-circle-nodes text-slate-500 w-4 text-center"></i> Vanilla Self-Attention
                    </button>
                </div>
            </div>

            <div>
                <span class="px-2 pb-1.5 block font-mono text-[10px] uppercase tracking-wider text-slate-500 font-bold">Serving & Cache Virtualization</span>
                <div class="space-y-1">
                    <button onclick="mountModule('paged_attention_vllm.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-database text-purple-400 w-4 text-center"></i> vLLM PagedAttention Map
                    </button>
                    <button onclick="mountModule('gqa_kv_compression.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-compress text-purple-400 w-4 text-center"></i> GQA / MQA Compression
                    </button>
                    <button onclick="mountModule('vllm_kv_quantization_int8_per_token_head.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-server text-purple-400 w-4 text-center"></i> KV Cache Int8 Per-Head
                    </button>
                    <button onclick="mountModule('turboquant_4bit_nc_visualizer.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-purple-400 w-4 text-center"></i> TurboQuant 4-Bit NC Cache
                    </button>
                </div>
            </div>

            <div>
                <span class="px-2 pb-1.5 block font-mono text-[10px] uppercase tracking-wider text-slate-500 font-bold">Speculative Acceleration</span>
                <div class="space-y-1">
                    <button onclick="mountModule('speculative_decoding.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-angles-right text-emerald-400 w-4 text-center"></i> Speculative Pipeline
                    </button>
                    <button onclick="mountModule('mtp_speculative_decoding.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-diagram-next text-emerald-400 w-4 text-center"></i> MTP (Multi-Token Predict)
                    </button>
                    <button onclick="mountModule('draft_speculative_decoding.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-code-fork text-slate-500 w-4 text-center"></i> Draft-Model Decoding
                    </button>
                </div>
            </div>

            <div>
                <span class="px-2 pb-1.5 block font-mono text-[10px] uppercase tracking-wider text-slate-500 font-bold">Quantization Optimization</span>
                <div class="space-y-1">
                    <button onclick="mountModule('autoround_signsgd_visualizer.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-calculator text-amber-400 w-4 text-center"></i> AutoRound Sign-SGD
                    </button>
                    <button onclick="mountModule('llm_quantization_comparison.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-scale-unbalanced text-amber-400 w-4 text-center"></i> PTQ: AWQ vs GPTQ
                    </button>
                </div>
            </div>

            <div>
                <span class="px-2 pb-1.5 block font-mono text-[10px] uppercase tracking-wider text-slate-500 font-bold">Context Scaling & Embeddings</span>
                <div class="space-y-1">
                    <button onclick="mountModule('rope_yarn_scaling.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-bezier-curve text-pink-400 w-4 text-center"></i> YaRN RoPE Scaling
                    </button>
                    <button onclick="mountModule('gated_deltanet.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-shield-halved text-pink-400 w-4 text-center"></i> Gated DeltaNet
                    </button>
                    <button onclick="mountModule('positional_encoding.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-arrow-down-1-9 text-slate-500 w-4 text-center"></i> Positional Encoding
                    </button>
                </div>
            </div>

            <div>
                <span class="px-2 pb-1.5 block font-mono text-[10px] uppercase tracking-wider text-slate-500 font-bold">Sparse & Linear Frameworks</span>
                <div class="space-y-1">
                    <button onclick="mountModule('mamba2_linear_ssm.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-blue-400 w-4 text-center"></i> Mamba-2 Linear SSM
                    </button>
                    <button onclick="mountModule('moe_architecture.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-network-wired text-blue-400 w-4 text-center"></i> Mixture of Experts (MoE)
                    </button>
                    <button onclick="mountModule('lightrag_architecture.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-sitemap text-blue-400 w-4 text-center"></i> LightRAG Topology
                    </button>
                </div>
            </div>

            <div>
                <span class="px-2 pb-1.5 block font-mono text-[10px] uppercase tracking-wider text-slate-500 font-bold">Hardware & Math Foundations</span>
                <div class="space-y-1">
                    <button onclick="mountModule('gpu_architecture_deepdive.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-microchip text-orange-400 w-4 text-center"></i> GPU Memory Hierarchy
                    </button>
                    <button onclick="mountModule('nvidia_gpu_architectures.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-hard-drive text-orange-400 w-4 text-center"></i> NVIDIA generations & Dtypes
                    </button>
                    <button onclick="mountModule('gradient_descent_llm.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-mountain text-orange-400 w-4 text-center"></i> 3D Gradient Descent
                    </button>
                    <button onclick="mountModule('rmsnorm_engine.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-scale-balanced text-orange-400 w-4 text-center"></i> RMSNorm Engine
                    </button>
                    <button onclick="mountModule('adamw_optimizer_deepdive.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-gauge text-orange-400 w-4 text-center"></i> AdamW Optimizer
                    </button>
                    <button onclick="mountModule('llm_loss_functions.html', this)" class="w-full text-left p-2 rounded-lg border border-transparent hover:bg-slate-900/50 text-slate-400 nav-btn flex items-center gap-2">
                        <i class="fa-solid fa-bullseye text-orange-400 w-4 text-center"></i> Cross-Entropy Loss
                    </button>
                </div>
            </div>

        </nav>
        
        <div class="p-3 bg-slate-950 border-t border-slate-900 text-center text-[10px] text-slate-600 font-mono">
            vLLM Reference Portal
        </div>
    </div>

    <div id="drawer-backdrop" onclick="toggleNavDrawer()" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden transition-all"></div>

    <iframe id="viewport-frame" src="flash_attention_deepdive.html" class="w-screen h-screen border-0 m-0 p-0 block z-10"></iframe>

    <script>
        let isDrawerOpen = false;

        function toggleNavDrawer() {
            const drawer = document.getElementById('nav-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            
            isDrawerOpen = !isDrawerOpen;
            
            if (isDrawerOpen) {
                drawer.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                drawer.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function mountModule(url, element) {
            // Manage active navigation classes
            if (element) {
                const buttons = document.querySelectorAll('.nav-btn');
                buttons.forEach(btn => btn.classList.remove('active'));
                element.classList.add('active');
            }

            // Swap iframe source directly
            document.getElementById('viewport-frame').src = url;

            // Automatically close drawer after click selection
            toggleNavDrawer();
        }
    </script>
</body>
</html>
